<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATFace — Đăng ký</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="auth-body"><div class="auth-card"><div class="logo"><span>⚡</span> AT<span>Face</span></div><h1>Tạo tài khoản</h1><p>Bắt đầu sử dụng ATFace ngay hôm nay.</p><div id="msg" class="msg"></div>
<form id="registerForm"><label>Tên hiển thị</label><input id="username" required maxlength="30" placeholder="Tên của bạn">
<label>Email</label><input id="email" type="email" required placeholder="you@example.com"><label>Mật khẩu</label><input id="password" type="password" minlength="6" required placeholder="Ít nhất 6 ký tự">
<button class="primary full">Tạo tài khoản <span>→</span></button></form><p class="switch">Đã có tài khoản? <a href="index.html">Đăng nhập</a></p></div>
<script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
